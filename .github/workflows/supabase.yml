name: Supabase

on:
  push:
    branches: [pilot/supabase]
    paths: ['supabase/**', 'packages/shared-types/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', 'packages/shared-types/**']

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start ephemeral local stack
        run: supabase db start

      - name: Lint migrations
        # pgtap's own extension functions produce false positives; lint our schema only.
        run: supabase db lint --schema public

      - name: Run pgTAP tests
        run: supabase test db

      - name: Verify generated types are checked in
        run: |
          if [ -f packages/shared-types/database.types.ts ]; then
            supabase gen types typescript --local > /tmp/database.types.ts
            diff /tmp/database.types.ts packages/shared-types/database.types.ts \
              || (echo "::error::packages/shared-types/database.types.ts is stale. Run: npm run sb:types" && exit 1)
          else
            echo "No generated types file yet; skipping check."
          fi

  deploy:
    name: Deploy to pilot project
    if: github.ref == 'refs/heads/pilot/supabase' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link pilot project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: supabase db push --linked

      - name: Deploy edge functions
        run: supabase functions deploy
