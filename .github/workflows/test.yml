name: Active apps

on:
  push:
    branches: [main, pilot/supabase]
  pull_request:
    branches: [main]

concurrency:
  group: active-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + design guard
    runs-on: ubuntu-latest
    env:
      CI: true
      HUSKY: 0
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: local-ci-placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce The Counter design system
        run: npm run design-guard -w @dukarun/web

      - name: Validate video compositions
        run: npm run check:video

      - name: Build active Angular applications
        run: npm run build:active
