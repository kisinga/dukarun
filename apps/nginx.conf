server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Never cache the shell or PWA metadata — stale shells break deploys.
  # (ngsw.json/manifest only exist in the web PWA; harmless elsewhere.)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /index.csr.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    # Static Angular apps emit this clean CSR shell for client-only/fallback routes.
    try_files $uri $uri/index.html /index.csr.html;
    # Hashed bundles are immutable
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
