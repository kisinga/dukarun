map $http_user_agent $public_content_crawler {
  default 0;
  ~*(?:facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|googlebot|bingbot|duckduckbot|applebot|yandexbot|baiduspider) 1;
}

map "$public_content_crawler:__APP__:$uri" $public_content_request {
  default 0;
  ~*^1:site:/blog/?$ 1;
  ~*^1:site:/blog/[a-z0-9]+(?:-[a-z0-9]+)*/?$ 1;
  ~*^1:storefront:/$ 1;
  ~*^1:storefront:/[a-z0-9]+(?:-[a-z0-9]+)*/?$ 1;
  "~*^1:storefront:/[a-z0-9]+(?:-[a-z0-9]+)*/products/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" 1;
}

# Caddy replaces X-Forwarded-For with the public client address before
# proxying to this container. Keep the last address as a safe fallback for a
# future trusted-proxy chain; direct container traffic falls back to remote_addr.
map $http_x_forwarded_for $storefront_client_ip {
  ~(?<storefront_last_forwarded_for>[^,\s]+)$ $storefront_last_forwarded_for;
  default $remote_addr;
}

# OPTIONS must remain cheap and reliable. Empty keys are not counted by
# limit_req, and search receives a separate tighter budget because it bypasses
# shared caching and executes full-text search.
map $request_method $storefront_api_rate_key {
  default $storefront_client_ip;
  OPTIONS "";
}

map $arg_search $storefront_search_rate_key {
  default $storefront_api_rate_key;
  "" "";
}

limit_req_zone $storefront_api_rate_key zone=storefront_api:10m rate=10r/s;
limit_req_zone $storefront_search_rate_key zone=storefront_search:10m rate=2r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Dynamic HTML is rendered only for crawlers. Browsers keep using the
  # Angular CSR path; storefront catalogue pages use the GET endpoint below.
  error_page 418 = /__public-content-renderer;

  location = /__public-content-renderer {
    internal;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header X-Public-App "__APP__";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Public-Storage-Origin "__SUPABASE_URL__";
    proxy_pass __SUPABASE_URL__/functions/v1/public-content-renderer;
  }

  # Same-origin, read-only storefront data. The edge function sets a short
  # shared-cache TTL; browsers never receive the Supabase anon key here.
  location ^~ /api/storefront/ {
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header X-Public-App "__APP__";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Public-Storage-Origin "__SUPABASE_URL__";
    # A proxy_pass URI inside this prefix location would append the unmatched
    # storefront slug to the function name (for example rendererjutik). Rewrite
    # to the one exact Edge Function entrypoint while preserving X-Original-URI.
    rewrite ^ /functions/v1/public-content-renderer break;
    proxy_pass __SUPABASE_URL__;
  }

  # Public, versioned storefront catalogue API. The function owns validation,
  # CORS, response shaping, and cache policy. Keep the legacy route above while
  # storefront clients move to v1.
  location ^~ /api/v1/storefronts/ {
    limit_req zone=storefront_api burst=20 nodelay;
    limit_req zone=storefront_search burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @storefront_api_rate_limited;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "Bearer __SUPABASE_ANON_KEY__";
    proxy_set_header apikey "__SUPABASE_ANON_KEY__";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Public-Storage-Origin "__SUPABASE_URL__";
    # Preserve the public path after the function name so any upstream cache
    # key stays distinct per storefront and product.
    rewrite ^/(.*)$ /functions/v1/storefront-api/$1 break;
    proxy_pass __SUPABASE_URL__;
  }

  location @storefront_api_rate_limited {
    internal;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Expose-Headers "X-Request-Id, Retry-After" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Request-Id "$request_id" always;
    add_header Retry-After "1" always;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests.","request_id":"$request_id"}}';
  }

  # Sitemaps are current database projections, not build artifacts.
  location = /sitemap.xml {
    return 418;
  }

  # Never cache the shell or PWA metadata — stale shells break deploys.
  # (ngsw.json/manifest only exist in the web PWA; harmless elsewhere.)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /index.csr.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Marketing videos are mounted from persistent host storage during site deploys.
  # Keep caching modest because delivery filenames remain stable between revisions.
  location ^~ /media/video/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # Tokenized customer documents are intentionally client-rendered and private.
  # Keep crawlers out even when they do not execute the page's JavaScript metadata.
  location ~ ^/(?:statement|document|track)/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/index.html /index.csr.html;
  }

  location / {
    # Static Angular apps emit this clean CSR shell for client-only/fallback routes.
    if ($public_content_request) { return 418; }
    try_files $uri $uri/index.html /index.csr.html;
    # Hashed bundles are immutable
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
