<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive reference for the public Dukarun Storefront API v1."
    />
    <title>Storefront API Reference | Dukarun</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      .dukarun-reference-bar {
        align-items: center;
        background: #0d5c3d;
        color: white;
        display: flex;
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        gap: 20px;
        justify-content: space-between;
        padding: 12px 20px;
      }
      .dukarun-reference-bar a {
        color: white;
      }
    </style>
  </head>
  <body>
    <nav class="dukarun-reference-bar" aria-label="Developer documentation">
      <a href="/developers/storefront">← Storefront API guide</a>
      <a href="/openapi/storefront-v1.yaml">OpenAPI file</a>
    </nav>
    <div id="api-reference"></div>
    <script src="/vendor/scalar/1.67.0/standalone.js"></script>
    <script>
      Scalar.createApiReference('#api-reference', {
        url: '/openapi/storefront-v1.yaml',
        theme: 'default',
        layout: 'modern',
        hideClientButton: false,
        hideDownloadButton: false,
      });
    </script>
    <noscript>
      JavaScript is required for the interactive reference. Download the
      <a href="/openapi/storefront-v1.yaml">OpenAPI file</a> instead.
    </noscript>
  </body>
</html>
